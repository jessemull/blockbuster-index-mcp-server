name: Run Task

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment (dev/prod)'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - prod
      component:
        description: 'Which signal to run'
        required: true
        default: 'amazon'
        type: choice
        options:
          - amazon
          - blockbuster-index
          - bls
          - broadband
          - census
          - walmart

jobs:
  run-task:
    name: Run ECS Task
    runs-on: ubuntu-latest
    steps:
      - name: Set Up AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Run ECS Task
        env:
          ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP || 'ENABLED' }}
          ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
        run: |
          if [[ -z "$ECS_SUBNETS" || -z "$ECS_SECURITY_GROUPS" ]]; then
            echo "ECS_SUBNETS and ECS_SECURITY_GROUPS repository/environment variables are required"
            exit 1
          fi
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            CLUSTER="blockbuster-index-prod"
            TASK_DEF="blockbuster-index-${{ github.event.inputs.component }}-task-prod"
          else
            CLUSTER="blockbuster-index-dev"
            TASK_DEF="blockbuster-index-${{ github.event.inputs.component }}-task-dev"
          fi
          TASK_ARN=$(aws ecs run-task \
            --cluster $CLUSTER \
            --task-definition $TASK_DEF \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUPS],assignPublicIp=$ECS_ASSIGN_PUBLIC_IP}" \
            --query 'tasks[0].taskArn' \
            --output text)
