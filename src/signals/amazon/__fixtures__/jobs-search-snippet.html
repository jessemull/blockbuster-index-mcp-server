<!DOCTYPE html>
<html>
  <body>
    <!-- Minimal Amazon careers filter/pagination snippet for selector contracts.
         Refresh from a live search page when scrapes fail due to DOM drift. -->
    <button name="desktopFilter_job_type" data-label="Part Time">
      Part Time <span class="job-count">(12)</span>
    </button>
    <button name="desktopFilter_job_type" data-label="Full Time">
      Full Time <span class="job-count">(150)</span>
    </button>
    <div class="pagination">
      <button class="page-button" data-label="1">1</button>
      <button class="page-button" data-label="2">2</button>
      <button class="page-button" data-label="15">15</button>
    </div>
  </body>
</html>
